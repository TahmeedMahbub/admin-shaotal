<!DOCTYPE html>
<html
  lang="en"
  class="light-style layout-navbar-fixed layout-menu-fixed"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="assets/"
  data-template="vertical-menu-template">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

    <title>Edit Subcategory | Aus Ecom Admin</title>
    <meta name="description" content="Edit Subcategory" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link rel="stylesheet" href="assets/vendor/fonts/materialdesignicons.css" />
    <link rel="stylesheet" href="assets/vendor/fonts/fontawesome.css" />
    <link rel="stylesheet" href="assets/vendor/libs/node-waves/node-waves.css" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="assets/vendor/css/rtl/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="assets/vendor/css/rtl/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="assets/css/demo.css" />
    
    <!-- Custom Beige Ambience CSS -->
    <link rel="stylesheet" href="assets/css/admin-beige.css" />

    <!-- Vendors CSS -->
    <link rel="stylesheet" href="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />

    <!-- Helpers -->
    <script src="assets/vendor/js/helpers.js"></script>
    <script src="assets/vendor/js/template-customizer.js"></script>
    <script src="assets/js/config.js"></script>
  </head>

  <body>
    <!-- Layout wrapper -->
    <div class="layout-wrapper layout-content-navbar">
      <div class="layout-container">
        
        <!-- SIDEBAR -->
        <aside id="layout-menu" class="layout-menu menu-vertical menu bg-menu-theme">
          <div class="app-brand demo">
            <a href="index.html" class="app-brand-link gap-2 align-items-center">
              <span class="app-brand-logo demo" style="color: #7E5B44;">
                <i class="mdi mdi-storefront-outline fs-3"></i>
              </span>
              <span class="app-brand-text demo menu-text fw-bold ms-1" style="color: #2A211D; letter-spacing: -0.01em;">AUS ECOM</span>
            </a>

            <a href="javascript:void(0);" class="layout-menu-toggle menu-link text-large ms-auto d-block">
              <i class="mdi mdi-chevron-left mdi-24px align-middle"></i>
            </a>
          </div>

          <div class="menu-inner-shadow"></div>

          <ul class="menu-inner py-2">
            <li class="menu-item"><a href="index.html" class="menu-link"><i class="menu-icon tf-icons mdi mdi-view-dashboard-outline"></i><div>Dashboard</div></a></li>
            <li class="menu-item active open">
              <a href="javascript:void(0);" class="menu-link menu-toggle">
                <i class="menu-icon tf-icons mdi mdi-package-variant-closed"></i>
                <div>Catalog</div>
              </a>
              <ul class="menu-sub">
                <li class="menu-item"><a href="products.html" class="menu-link"><div>Products</div></a></li>
                <li class="menu-item"><a href="categories.html" class="menu-link"><div>Categories</div></a></li>
                <li class="menu-item active"><a href="subcategories.html" class="menu-link"><div>Subcategories</div></a></li>
                <li class="menu-item"><a href="brands.html" class="menu-link"><div>Brands</div></a></li>
              </ul>
            </li>
          </ul>
        </aside>

        <!-- LAYOUT PAGE -->
        <div class="layout-page">
          
          <!-- FIXED TOP BAR -->
          <nav class="layout-navbar navbar navbar-expand-xl align-items-center" id="layout-navbar">
            <div class="container-fluid d-flex align-items-center justify-content-between px-0">
              <div class="d-flex align-items-center gap-3">
                <a class="nav-item nav-link px-0 me-3 layout-menu-toggle" href="javascript:void(0)">
                  <i class="mdi mdi-menu mdi-24px"></i>
                </a>
                <nav aria-label="breadcrumb">
                  <ol class="breadcrumb mb-0 py-0" style="font-size: 0.875rem;">
                    <li class="breadcrumb-item"><a href="index.html">Admin</a></li>
                    <li class="breadcrumb-item"><a href="subcategories.html">Subcategories</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Edit Dining Tables</li>
                  </ol>
                </nav>
              </div>
            </div>
          </nav>

          <!-- CONTENT WRAPPER -->
          <div class="content-wrapper">
            <div class="container-xxl flex-grow-1 container-p-y pb-5">
              
              <form action="subcategories.html">
                <div class="d-flex align-items-center justify-content-between mb-4">
                  <div>
                    <h4 class="fw-bold mb-1" style="color: var(--beige-text-dark);">Edit Subcategory: Dining Tables</h4>
                    <p class="text-muted mb-0 fs-7">Parent: <span class="badge bg-label-primary">Furniture</span> &bull; 42 Products linked</p>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <a href="subcategories.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-beige"><i class="mdi mdi-check me-1"></i> Update Subcategory</button>
                  </div>
                </div>

                <div class="row g-4">
                  <div class="col-12 col-lg-8">
                    <div class="card mb-4">
                      <div class="card-header border-bottom py-3">
                        <h5 class="card-title mb-0 fs-6">Subcategory Details</h5>
                      </div>
                      <div class="card-body pt-3">
                        <div class="mb-3">
                          <label class="form-label fw-bold fs-8">Parent Category <span class="text-danger">*</span></label>
                          <select class="form-select" required>
                            <option value="Furniture" selected>Furniture</option>
                            <option value="Home & Living">Home & Living</option>
                            <option value="Textiles">Textiles</option>
                          </select>
                        </div>
                        <div class="mb-3">
                          <label class="form-label fw-bold fs-8">Subcategory Name <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" value="Dining Tables" required>
                        </div>
                        <div class="mb-3">
                          <label class="form-label fw-bold fs-8">Slug</label>
                          <input type="text" class="form-control" value="dining-tables">
                        </div>
                        <div class="mb-3">
                          <label class="form-label fw-bold fs-8">Description</label>
                          <textarea class="form-control" rows="3">Solid wood dining tables, extendable tables, and round 6-8 seater dining tables.</textarea>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-12 col-lg-4">
                    <div class="card mb-4">
                      <div class="card-header border-bottom py-3">
                        <h5 class="card-title mb-0 fs-6">Settings</h5>
                      </div>
                      <div class="card-body pt-3">
                        <div class="mb-3">
                          <label class="form-label fw-bold fs-8">Sort Order</label>
                          <input type="number" class="form-control" value="1">
                        </div>
                        <div class="mb-3">
                          <label class="form-label fw-bold fs-8">Status</label>
                          <select class="form-select">
                            <option value="Active" selected>Active</option>
                            <option value="Inactive">Inactive</option>
                          </select>
                        </div>
                        <button type="submit" class="btn btn-beige w-100">Update Subcategory</button>
                      </div>
                    </div>
                  </div>
                </div>
              </form>

            </div>

            <!-- FOOTER -->
            <footer class="content-footer footer bg-footer-theme" style="background-color: var(--beige-bg-main) !important; border-top: 1px solid var(--beige-border-subtle);">
              <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                <div class="mb-2 mb-md-0 fs-8 text-muted">
                  © 2026 Aus Ecom Admin Catalog.
                </div>
              </div>
            </footer>
          </div>
        </div>
      </div>
      <div class="layout-overlay layout-menu-toggle"></div>
    </div>

    <!-- CORE JS -->
    <script src="assets/vendor/libs/jquery/jquery.js"></script>
    <script src="assets/vendor/libs/popper/popper.js"></script>
    <script src="assets/vendor/js/bootstrap.js"></script>
    <script src="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
    <script src="assets/vendor/libs/node-waves/node-waves.js"></script>
    <script src="assets/vendor/js/menu.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
